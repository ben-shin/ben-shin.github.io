name: Update Simulation Progress

permissions:
  contents: write

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: update-simulation-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest status
        run: |
          set -euo pipefail
          mkdir -p sim-progress
          curl -fsSL "${{ secrets.API_URL }}" -o sim-progress/status.json
          python -m json.tool sim-progress/status.json > /dev/null

      - name: Update history.json
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import datetime

          dest = "sim-progress"
          status_path = os.path.join(dest, "status.json")
          hist_path = os.path.join(dest, "history.json")

          with open(status_path, "r", encoding="utf-8") as f:
              status = json.load(f)

          history = {}
          if os.path.exists(hist_path):
              try:
                  with open(hist_path, "r", encoding="utf-8") as f:
                      history = json.load(f) or {}
              except Exception:
                  history = {}

          timestamp = (
              status.get("generated_at")
              or datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          )

          simulations = status.get("simulations", [])

          for sim in status.get('simulations', []):
              sid = sim.get("id") or sim.get("path") or "unknown"
              stage = sim.get("active_stage") or {}

              entry = {
                  "timestamp": timestamp,
                  "ns": stage.get("current_ns"),
                  "temperature_k": stage.get("temperature_k"),
                  "pressure_bar": stage.get("pressure_bar"),
                  "performance_ns_per_day": stage.get("performance_ns_per_day"),
                  "potential_kj_mol": stage.get("potential_kj_mol"),
              }

              history.setdefault(sid, []).append(entry)
#             history[sid] = history[sid][-200:]

          with open(hist_path, "w", encoding="utf-8") as f:
              json.dump(history, f, indent=2)
              f.write("\n")
          PY

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add sim-progress/status.json sim-progress/history.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update simulation progress"
          git push origin "HEAD:${GITHUB_REF_NAME}"
