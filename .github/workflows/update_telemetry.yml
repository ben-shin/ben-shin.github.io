name: Update Simulation Progress

# This workflow fetches the latest simulation status from an external endpoint
# and publishes it to the `sim-progress` folder of this repository.  It runs
# on a schedule and on manual dispatch.  The `API_URL` secret should point
# to your exposed `server.py` endpoint, e.g. https://<your-domain>/api/status.
# A personal access token with `repo` scope must be stored as the `PAT` secret
# to allow pushing changes back to the repository.

on:
  schedule:
    # Adjust the cron schedule to suit your needs; the example below runs every
    # 10 minutes.  Note that GitHub Pages has a soft limit of 10 builds per hour
    # unless you build via Actions【350758863010898†L105-L107】.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Fetch latest status
        run: |
          set -e
          mkdir -p sim-progress
          # Fetch status.json from your server.  The API_URL secret should
          # include the full path, e.g. https://your.example.com/api/status
          curl -sSL "$API_URL" -o sim-progress/status.json
      - name: Update history.json
        run: |
          python - <<'PY'
            import json, os, datetime, sys
            dest = 'sim-progress'
            status_path = os.path.join(dest, 'status.json')
            hist_path = os.path.join(dest, 'history.json')
            with open(status_path) as f:
                status = json.load(f)
            history = {}
            if os.path.exists(hist_path):
                try:
                    with open(hist_path) as f:
                        history = json.load(f) or {}
                except Exception:
                    history = {}
            timestamp = status.get('generated_at') or datetime.datetime.utcnow().isoformat(timespec='seconds')
            for sim in status.get('simulations', []):
                sid = sim.get('id') or sim.get('path') or 'unknown'
                stage = sim.get('active_stage') or {}
                entry = {
                    'timestamp': timestamp,
                    'ns': stage.get('current_ns'),
                    'temperature_k': stage.get('temperature_k'),
                    'pressure_bar': stage.get('pressure_bar'),
                    'performance_ns_per_day': stage.get('performance_ns_per_day'),
                    'potential_kj_mol': stage.get('potential_kj_mol'),
                }
                history.setdefault(sid, []).append(entry)
                if len(history[sid]) > 200:
                    history[sid] = history[sid][-200:]
            with open(hist_path, 'w') as f:
                json.dump(history, f, separators=(',', ':'))
          PY
      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sim-progress
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update simulation progress via scheduled workflow"
          # Push using the personal access token
          git push https://x-access-token:${PAT}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
