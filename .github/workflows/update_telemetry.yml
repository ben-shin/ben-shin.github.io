name: Update Simulation Progress

# Grant the workflow permission to update repository contents.  Without this
# `contents: write` permission, the default `GITHUB_TOKEN` may only have
# read access, which prevents pushing changes back to the repository【359719011947102†L1171-L1184】.
permissions:
  contents: write

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Use the same token for checkout and push. When the `token` input is provided
    # to actions/checkout, it configures git to use that token for all subsequent
    # git operations, including pushes【648927039738649†L154-L167】.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Fetch latest status
        run: |
          set -e
          mkdir -p sim-progress
          # Fetch status.json from your server using the API_URL secret.
          curl -sSL "${{ secrets.API_URL }}" -o sim-progress/status.json
      - name: Update history.json
        run: |
          python <<'PY'
import json
import os
import datetime

dest = 'sim-progress'
status_path = os.path.join(dest, 'status.json')
hist_path = os.path.join(dest, 'history.json')

with open(status_path) as f:
    status = json.load(f)

history = {}
if os.path.exists(hist_path):
    try:
        with open(hist_path) as f:
            history = json.load(f) or {}
    except Exception:
        history = {}

timestamp = status.get('generated_at') or datetime.datetime.utcnow().isoformat(timespec='seconds')

for sim in status.get('simulations', []):
    sid = sim.get('id') or sim.get('path') or 'unknown'
    stage = sim.get('active_stage') or {}
    entry = {
        'timestamp': timestamp,
        'ns': stage.get('current_ns'),
        'temperature_k': stage.get('temperature_k'),
        'pressure_bar': stage.get('pressure_bar'),
        'performance_ns_per_day': stage.get('performance_ns_per_day'),
        'potential_kj_mol': stage.get('potential_kj_mol'),
    }
    history.setdefault(sid, []).append(entry)
    if len(history[sid]) > 200:
        history[sid] = history[sid][-200:]

with open(hist_path, 'w') as f:
    json.dump(history, f, separators=(',', ':'))
          PY
      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sim-progress
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update simulation progress via scheduled workflow"
          git push
