<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1720">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GROMACS">
    <title>GROMACS Progress</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icon.svg" alt="" class="brand-icon">
        <div>
          <h1>GROMACS Progress</h1>
          <p id="sourceRoot">Loading</p>
        </div>
      </div>
      <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6v5h-5"></path>
          <path d="M4 18v-5h5"></path>
          <path d="M18 9a7 7 0 0 0-11.7-2.7L4 8"></path>
          <path d="M6 15a7 7 0 0 0 11.7 2.7L20 16"></path>
        </svg>
      </button>
    </header>

    <main>
      <section id="activeHero" class="active-hero" aria-label="Active simulation"></section>

      <section class="summary-grid" aria-label="Summary">
        <div class="metric">
          <span class="metric-label">Running</span>
          <strong id="runningCount">-</strong>
        </div>
        <div class="metric">
          <span class="metric-label">Active</span>
          <strong id="activePercent">-</strong>
        </div>
        <div class="metric wide">
          <span class="metric-label">ETA</span>
          <strong id="activeEta">-</strong>
        </div>
      </section>

      <nav class="tabs" aria-label="Simulation filters">
        <button class="tab active" type="button" data-filter="all">All</button>
        <button class="tab" type="button" data-filter="running">Running</button>
        <button class="tab" type="button" data-filter="attention">Attention</button>
        <button class="tab" type="button" data-filter="complete">Done</button>
      </nav>

      <section id="simulationList" class="simulation-list" aria-live="polite"></section>
      <section id="emptyState" class="empty-state" hidden>
        <h2>No matching simulations</h2>
      </section>
    </main>

    <footer>
      <span id="lastRefresh">Not refreshed yet</span>
      <span id="healthState">Checking</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
